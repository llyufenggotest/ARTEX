name: yf-docker
# YF 魔改镜像：main 分支每次 push 构建并推 ghcr.io/llyufenggotest/artex-yf
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "start.sh"
      - "skills/**"
      - ".github/workflows/yf-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: yf-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 前端静态导出 → 内嵌
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web

      # 预编译 amd64 二进制（与官方 release.yml 的 dist 布局一致）
      - name: Build artex binary
        env:
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          ARTEX_COMPRESS: "0"
        run: |
          cp -r web/out server/webui/dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags embedui -o dist/amd64/artex ./cmd/artex

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/llyufenggotest/artex-yf:latest
            ghcr.io/llyufenggotest/artex-yf:sha-${{ github.sha }}
          cache-from: type=gha,scope=yf-docker
          cache-to: type=gha,mode=max,scope=yf-docker

      # 破盾层冒烟：起容器，验证 Xvfb 常驻 + DrissionPage/ddddocr import + chromium 存在
      - name: Smoke test shield layer
        run: |
          docker pull ghcr.io/llyufenggotest/artex-yf:latest
          docker run -d --name yf-smoke ghcr.io/llyufenggotest/artex-yf:latest
          sleep 12
          echo "--- Xvfb ---"
          docker exec yf-smoke pgrep -x Xvfb && echo "XVFB OK"
          echo "--- python pkgs ---"
          docker exec yf-smoke python3 -c "import DrissionPage, ddddocr, curl_cffi; print('SHIELD PKGS OK')"
          echo "--- chromium ---"
          docker exec yf-smoke ls /root/.cache/ms-playwright/ | grep chromium
          echo "--- cf-bypass skill ---"
          docker exec yf-smoke ls /app/skills/ | grep cf-bypass
          docker rm -f yf-smoke
